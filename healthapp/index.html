<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HealthApp</title>
  <link rel="stylesheet" href="styles/style.css" />
</head>

<body>

<!-- =====================
     LOGIN PAGE
===================== -->
<div class="login-container" id="loginPage">

  <div class="app-title">HealthApp</div>

  <!-- RABBIT LAYER -->
  <div class="rabbit-layer">
    <video id="rabbitIdle" class="rabbit active"
      autoplay muted loop playsinline
      src="assets/animations/rabbit-animation-sit.mp4"></video>

    <video id="rabbitSuccess" class="rabbit"
      muted playsinline
      src="assets/animations/rabbit-animation-smile.mp4"></video>

    <video id="rabbitError" class="rabbit"
      muted playsinline
      src="assets/animations/rabbit-animation-sad.mp4"></video>
  </div>

  <div id="fireworks" class="fireworks"></div>
  <div id="successToast" class="success-toast"></div>

  <!-- LOGIN FORM -->
  <div class="content">
    <div class="form-area">
      <div class="form-glass">

        <label>Email</label>
        <div class="input-wrap">
          <input id="username" type="email" placeholder="Enter Email" autocomplete="off" />
          <img id="rabbitCaret" class="rabbit-caret" src="assets/ui/rabbit-caret.png" />
        </div>

        <label>Password</label>
        <div class="input-wrap">
          <input id="password" type="password" placeholder="Enter Password" autocomplete="off" />
          <img id="rabbitCaretPassword" class="rabbit-caret" src="assets/ui/rabbit-caret.png" />
        </div>

        <button id="loginBtn">Login</button>

      </div>
    </div>
  </div>
</div>

<!-- =====================
     HOME PAGE
===================== -->
<div class="home-container hidden" id="homePage">

  <div class="home-header">
    <h2>Welcome 👋</h2>
    <p>Your Health Overview</p>
  </div>

  <div class="home-cards">

    <div class="health-card">
      <img src="assets/icons/heart.png" class="health-icon" />
      <div>
        <h3>Heart Rate</h3>
        <p>72 bpm</p>
      </div>
    </div>

    <div class="health-card">
      <img src="assets/icons/steps.png" class="health-icon" />
      <div>
        <h3>Steps</h3>
        <p>4,320</p>
      </div>
    </div>

    <!-- WATER CARD -->
    <div class="health-card water-card">
      <img src="assets/icons/water.png" class="health-icon" />
      <div>
        <h3>Water Intake</h3>
        <p>1.8 L</p>
      </div>
    </div>

  </div>
</div>

<!-- =====================
     WATER PAGE
===================== -->
<div class="water-page hidden" id="waterPage">

  <div class="water-header">
    <h2>Water Intake</h2>
    <p id="waterPercent">80%</p>
  </div>

  <!-- ✨ Smooth human container -->
  <div class="water-body">
    <div class="human-card">
      <object
        id="waterSvg"
        type="image/svg+xml"
        data="assets/water/human.svg">
      </object>
    </div>
  </div>

  <button class="back-btn" id="backToHome">← Back</button>
</div>

<script src="scripts/script.js"></script>
</body>
</html>
